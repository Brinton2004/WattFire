<title>WattFire Training Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one-column training log. Sticky header + tab bar; a day card is the hero; zone colors are the only loud color. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E4EAE6; --ink:#13201B; --muted:#56655E; --line:#D3DCD6;
  --accent:#1D5C47; --accent-ink:#FFFFFF; --accent-soft:#DCEAE2; --warn:#9A5B00; --warn-soft:#FBEFD9;
  --z1:#8C9A93; --z2:#2F78C0; --z3:#27936A; --ss:#A39317; --z4:#D99A0E; --z5:#DB6112; --z6:#CC3434; --z7:#8A39B3;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --sunk:#111915; --ink:#E5ECE8; --muted:#97A69F; --line:#2A3631;
  --accent:#6CC3A0; --accent-ink:#0E1412; --accent-soft:#1C2F27; --warn:#F2B866; --warn-soft:#2E2414;
  --z1:#9AA8A1; --z2:#5FA3E8; --z3:#4CC28F; --ss:#CDBD3A; --z4:#F0B637; --z5:#F2803A; --z6:#EF5E5E; --z7:#B672DB;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --sunk:#111915; --ink:#E5ECE8; --muted:#97A69F; --line:#2A3631;
  --accent:#6CC3A0; --accent-ink:#0E1412; --accent-soft:#1C2F27; --warn:#F2B866; --warn-soft:#2E2414;
  --z1:#9AA8A1; --z2:#5FA3E8; --z3:#4CC28F; --ss:#CDBD3A; --z4:#F0B637; --z5:#F2803A; --z6:#EF5E5E; --z7:#B672DB;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2.3rem}h2{font-size:1.65rem}h3{font-size:1.25rem}
p{margin:0}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.brand svg{width:26px;height:18px;align-self:center;flex:none}
.countdown{flex:1 1 0;font-size:.85rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.countdown strong{color:var(--ink);font-family:var(--f-mono);font-weight:500}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs a{font-weight:600;font-size:.88rem;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:8px}
nav.tabs a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav.tabs a:hover:not([aria-current="page"]){background:var(--sunk);color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:22px 110px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner b{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--zc,var(--z2))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}

/* zone color hooks */
.zZ1{--zc:var(--z1)}.zZ2{--zc:var(--z2)}.zZ3{--zc:var(--z3)}.zSS{--zc:var(--ss)}.zZ4{--zc:var(--z4)}.zZ5{--zc:var(--z5)}.zZ6{--zc:var(--z6)}.zZ7{--zc:var(--z7)}
.zREST{--zc:var(--line)}.zRACE{--zc:var(--ink)}.zGYM{--zc:var(--muted)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip button{font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);min-width:0}
.strip button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.strip .dn{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.strip .dd{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1}
.strip .bar{width:70%;height:5px;border-radius:3px;background:var(--zc)}
.strip .is-today .dd{color:var(--accent)}
.strip .done .bar{opacity:.35}
.strip .tick{font-size:.7rem;color:var(--accent);height:1em}

/* day card */
.day-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.day-title{font-size:2.6rem;line-height:1}
.metrics{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.metric .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1}
.metric .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.profile{display:flex;align-items:flex-end;gap:2px;height:84px;margin-top:18px;padding:8px;background:var(--sunk);border-radius:8px}
.profile i{display:block;flex-grow:var(--w);flex-basis:0;min-width:2px;height:var(--h);background:var(--zc);border-radius:2px 2px 0 0}
.steps{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}
.steps td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.steps td:first-child{width:76px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps.lift td:first-child{white-space:normal;width:34%;font-size:.82rem}
.steps .sw{width:10px;padding-right:0}
.steps .sw span{display:block;width:6px;height:18px;border-radius:2px;background:var(--zc)}
.target{color:var(--muted);font-size:.82rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
ul.tips{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.done-toggle{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.done-toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* plan */
.timeline{display:flex;height:34px;border-radius:8px;overflow:hidden;position:relative;margin-top:10px}
.timeline span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:clip}
.ph-base{background:var(--z2)}.ph-build{background:var(--z4)}.ph-peak{background:var(--z5)}.ph-taper{background:var(--z3)}
.timeline .now{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.stat .k{font-size:.8rem;color:var(--muted)}
details.week{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.week>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
details.week>summary::-webkit-details-marker{display:none}
.wk-n{font-family:var(--f-display);font-size:1.3rem;font-weight:700;width:2.4em}
.wk-meta{min-width:0}
.wk-meta .d{font-size:.82rem;color:var(--muted)}
.wk-bars{display:flex;gap:3px;align-items:flex-end;height:26px}
.wk-bars i{width:9px;border-radius:2px;background:var(--zc);height:var(--h)}
.wk-days{padding:0 16px 12px}
.wk-day{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.wk-day button{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-weight:600}
.wk-day .when{font-size:.84rem;color:var(--muted)}
.wk-day.today .when{color:var(--accent);font-weight:600}
.tblwrap{overflow-x:auto}
table.zones{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
table.zones th,table.zones td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}
table.zones th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-top:0}
table.zones td.mono{white-space:nowrap}

/* library */
.ex{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
.ex-fig{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ex-fig svg{width:72%;height:72%}
.ex h3{margin-bottom:2px}
.ex dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.ex dt{font-weight:600;color:var(--muted)}
.ex dd{margin:0;min-width:0}
details.art{border-top:1px solid var(--line);padding-block:4px}
details.art:first-of-type{border-top:0}
details.art>summary{cursor:pointer;padding:10px 0;font-family:var(--f-display);font-size:1.3rem;font-weight:700}
details.art .body{padding-bottom:14px;display:flex;flex-direction:column;gap:10px;max-width:68ch}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{font:600 .82rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
ol.refs{padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:.9rem;margin:0}
.principle{display:grid;grid-template-columns:1fr;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.principle:first-child{border-top:0;padding-top:0}
.principle h3{font-size:1.2rem}

/* form */
form.setup{display:flex;flex-direction:column;gap:18px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;margin:0;min-width:0}
legend{font-family:var(--f-display);font-size:1.3rem;font-weight:700;padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.88rem;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],input[type=date],select{font:inherit;font-weight:400;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:.88rem;background:var(--bg)}
.days input{accent-color:var(--accent)}
.err{color:var(--z6);font-weight:600}
.ph-recover{background:var(--z1)}
.sched{display:flex;flex-direction:column;margin-top:6px}
.sched-row{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sched-row:first-child{border-top:0}
.sched-when{display:flex;flex-direction:column}
.marks{position:relative;height:24px;margin-top:10px}
.rm{position:absolute;top:0;transform:translateX(-50%);font:700 .72rem var(--f-body);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg)}
.rm.prio-B{background:var(--muted)}.rm.prio-C{background:var(--surface);color:var(--ink);border:1.5px solid var(--muted)}
.chip.prio-A{background:var(--accent);color:var(--accent-ink)}.chip.prio-B{background:var(--accent-soft);color:var(--ink)}.chip.prio-C{background:var(--sunk);color:var(--muted)}
.sub{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.choice input{accent-color:var(--accent);width:18px;height:18px}
.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.checkin-card{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-color:var(--accent);background:var(--accent-soft)}
.devrow{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.wk-files{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
ol.how{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.path{font-family:var(--f-mono);font-size:.85rem;background:var(--sunk);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-top:12px}
.vid{margin:0;min-width:0}
.vid-play{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--sunk);cursor:pointer}
.vid-play img{width:100%;height:100%;object-fit:cover;display:block}
.vid-icon{position:absolute;left:50%;top:50%;width:58px;height:40px;margin:-20px 0 0 -29px;border-radius:10px;background:rgba(0,0,0,.72)}
.vid-icon::after{content:"";position:absolute;left:23px;top:11px;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff}
.vid-play:hover .vid-icon{background:#cc0000}
.vid iframe{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
.vid figcaption{font-size:.84rem;margin-top:6px}

@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;z-index:40}
  nav.tabs a{padding:8px 6px;font-size:.78rem;flex:1;text-align:center}
  .day-title{font-size:2.1rem}
  h1{font-size:1.9rem}
  .ex{grid-template-columns:72px 1fr;gap:12px}
  .wk-day{grid-template-columns:70px 1fr auto}
  .card{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.btn,.strip button,nav.tabs a{transition:background .15s,box-shadow .15s}}
@media print{header.top,nav.tabs{display:none}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 26 18" aria-hidden="true"><path d="M1 16 L8 6 L12 11 L18 2 L25 16" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <b>WattFire</b>
    </div>
    <div class="countdown" id="countdown"></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#today" data-v="today">Today</a>
      <a href="#plan" data-v="plan">Plan</a>
      <a href="#strength" data-v="strength">Gym</a>
      <a href="#technique" data-v="technique">Skills</a>
      <a href="#science" data-v="science">Science</a>
      <a href="#setup" data-v="setup">Setup</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script src="videos.js"></script>
<script>
/* ============ utilities ============ */
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const di=d=>(d.getDay()+6)%7;
const monday=d=>addDays(d,-di(d));
const fmtD=d=>`${DAYN[di(d)]}, ${MON[d.getMonth()]} ${d.getDate()}`;
const fmtShort=d=>`${MON[d.getMonth()]} ${d.getDate()}`;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r25=x=>Math.round(x*4)/4;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtH(h){const m=Math.round(h*60);const H=Math.floor(m/60),M=m%60;return H?(M?`${H}h${pad(M)}`:`${H}h`):`${M} min`}
function fmtMin(min){if(min<1)return `${Math.round(min*60)} s`;if(min>=60)return fmtH(min/60);return `${Math.round(min*10)/10} min`}
const isSess=x=>x.kind==='ride'||x.kind==='run';
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};

/* ============ zones ============ */
const ZONES=[
 {k:'Z1',name:'Recovery',p:[0,55],h:[0,81],m:[50,60],rpe:'1–2',talk:'Easy chatting',i:1},
 {k:'Z2',name:'Endurance',p:[56,75],h:[81,89],m:[60,72],rpe:'3–4',talk:'Full sentences',i:2},
 {k:'Z3',name:'Tempo',p:[76,87],h:[90,93],m:[72,82],rpe:'5–6',talk:'Short sentences',i:3},
 {k:'SS',name:'Sweet spot',p:[88,93],h:[93,96],m:[82,87],rpe:'6–7',talk:'A few words at a time',i:3.6},
 {k:'Z4',name:'Threshold',p:[94,105],h:[96,100],m:[87,92],rpe:'7–8',talk:'One or two words',i:4.3},
 {k:'Z5',name:'VO₂max',p:[106,120],h:[100,106],m:[92,100],rpe:'8–9',talk:'Can’t talk',i:5.3},
 {k:'Z6',name:'Anaerobic',p:[121,150],h:null,m:null,rpe:'9–10',talk:'All-out for 30 s–2 min',i:6.3},
 {k:'Z7',name:'Sprint',p:[151,null],h:null,m:null,rpe:'10',talk:'Maximal, under 20 s',i:7.2},
];

  if(!Array.isArray(p.events))p.events=p.event?[{...p.event,id:'e1',priority:'A'}]:[];
  delete p.event;
  p.events.forEach((e,i)=>{if(!e.id)e.id='e'+(i+1)+Date.now().toString(36);if(!e.priority)e.priority='A'});

function keySessions(phase,prog,ev,fam){
  const t=disc(ev);
  if(phase==='base')return prog<0.4?['tempo','sprints']:['sweetspot','sprints'];
  if(phase==='build'){
    if(t==='tt')return ['threshold','vo2'];
    if(t==='climb')return ['climbs','vo2'];
    if(t==='crit'||t==='cx'||fam==='short')return ['vo2','anaerobic'];
    if(t==='xc')return ['vo2','climbs'];
    if(t==='roadrace')return ['vo2','threshold'];
    if(t==='mtb')return ['climbs','vo2'];
    if(fam==='ultra')return ['threshold','vo2'];
    return ['vo2','threshold'];
  }
  if(phase==='peak'){
    if(t==='climb')return ['climbs','vo2'];
    if(t==='tt')return ['threshold','vo2'];
    if(t==='crit'||t==='cx'||t==='roadrace'||t==='xc'||fam==='short')return ['anaerobic','vo2'];
    return fam==='ultra'?['vo2','racepace']:['racepace','vo2'];
  }
  return ['taperSharp'];
}

function makeRun(type,mi,ctx){

  return {kind:'run',type,title:def.title,zone:def.zone,purpose:def.purpose,tips,steps,hours:steps.reduce((a,s)=>a+s.min,0)/60,miles:steps.reduce((a,s)=>a+s.dist,0),ctx};
}
function keyRunSessions(phase,prog,ev){

function pickHardDays(D,longDay,keys){

      if(d===(longDay+1)%7)s-=0.6;

function buildRunWeek(p,wk,nextStr){
  const ev=wk.ev,av=wk.avail;
  let D=av.days.map((v,i)=>v?i:-1).filter(i=>i>=0);if(!D.length)D=[1,3,5];
  const days=Array.from({length:7},(_,i)=>({date:addDays(wk.start,i),items:[]}));
  const longDay=D.includes(av.longDay)?av.longDay:D[D.length-1];
  const nHard=wk.recovery?0:wk.phase==='taper'?1:(D.length>=5||wk.phase!=='base')&&D.length>=4?2:1;
  const hardDays=pickHardDays(D,longDay,wk.recovery?[]:keyRunSessions(wk.phase,wk.prog,ev).slice(0,nHard));
  const rem=D.filter(d=>d!==longDay&&!hardDays.some(h=>h.d===d));
  const after=(longDay+1)%7;
  const recDay=D.length>=6&&rem.includes(after)?after:null;
  const easyDays=rem.filter(d=>d!==recDay);
  const ctx={phase:wk.phase,prog:wk.prog,ev,rp:wk.rp,setting:av.setting};
  const longType=wk.phase==='peak'&&!wk.recovery&&['marathon','half'].includes(ev.type)?'mplong':'long';
  const put=(d,type,mi)=>days[d].items.push(makeRun(type,mi,ctx));
  put(longDay,longType,wk.long);
  const q=clamp(wk.miles*0.17,4,9);
  hardDays.forEach(h=>put(h.d,h.type,q));
  let used=wk.long+q*hardDays.length;
  if(recDay!=null){put(recDay,'recovery',3);used+=3}
  if(easyDays.length){
    const each=clamp((wk.miles-used)/easyDays.length,3,wk.phase==='taper'?5:10);
    easyDays.forEach((d,i)=>put(d,i===0&&!wk.recovery&&wk.phase!=='taper'?'strides':'easy',each));
  }
  const tot=()=>days.reduce((a,d)=>a+d.items.filter(x=>x.kind==='run').reduce((s,x)=>s+x.miles,0),0);
  let runs=days.filter(d=>d.items.length).length;
  for(const d of [...(recDay!=null?[recDay]:[]),...easyDays.slice().reverse()]){

    days[d].items=[];runs--;

  days.forEach(d=>{if(!d.items.length)d.items.push({kind:'rest',title:'Rest day'})});

}
function runRaceWeek(p,wk,A){
  const days=Array.from({length:7},(_,i)=>({date:addDays(wk.start,i),items:[]}));
  const e=di(A.d),ctx={phase:'taper',prog:1,ev:A,rp:wk.rp,setting:wk.avail.setting},D=wk.avail.days;let sharp=false;
  for(let d=0;d<7;d++){
    const gap=e-d;
    if(gap===0)days[d].items.push(raceItem(A));
    else if(gap<0)days[d].items.push({kind:'rest',title:'Recovery',note:'Rest or walk. Easy running can wait a few days; after a marathon, keep running very light for a week or two.'});
    else if(gap===1)days[d].items.push(D[d]?makeRun('shakeout',2.5,ctx):{kind:'rest',title:'Rest day',note:'Rest, hydrate, and lay out your race kit.'});
    else if(gap===2)days[d].items.push({kind:'rest',title:'Rest day',note:'Full rest. Eat well and sleep.'});
    else if(D[d]){if(!sharp&&gap<=4){days[d].items.push(makeRun('sharpen',4,ctx));sharp=true}else days[d].items.push(makeRun('easy',gap>=5?4:3,ctx))}

function buildRunCycle(p,start,N,A,carry,str,notes){
  const r=p.run||{},age=+p.age||40,k=(age>=50||p.experience==='new')?3:4,rp=runPaces(p);
  const longRace=A.type==='marathon'||A.type==='trail';
  const pre=carry&&N>1?1:0,R0=N-pre;
  const taperW=longRace&&R0>=14?3:(longRace||A.type==='half')&&R0>=6?2:1;
  const R=Math.max(0,R0-taperW);
  const peakW=R>=16?3:R>=8?2:R>=4?1:0;
  let buildW=R>=6?Math.round((R-peakW)*0.4):Math.max(0,R-peakW-1);
  let baseW=Math.max(0,R-peakW-buildW);
  if(carry&&R<12){buildW+=baseW;baseW=0}
  const E=paceMid('Z2',rp)/60;
  const raceMi=RUN_TYPES[A.type].mi||Math.max(13,(+A.durationH||5)*60/(E*1.25));
  const longMax=A.type==='marathon'?Math.min(20,180/E):A.type==='half'?Math.min(13,150/E):A.type==='10k'?Math.min(10,100/E):A.type==='5k'?Math.min(8,80/E):Math.min(raceMi*0.6,240/(E*1.15));
  const share=A.type==='marathon'||A.type==='trail'?0.4:0.33;
  const av0=availAt(p,start);
  const w0=carry?carry.load*0.85:clamp(+r.curMiles||10,5,Math.max(5,av0.maxMiles));
  const long0=carry?clamp(carry.long*0.8,3,longMax):clamp(+r.longest||4,3,longMax);
  const phases=[['recover',0,pre],['base',pre,baseW],['build',pre+baseW,buildW],['peak',pre+baseW+buildW,peakW],['taper',pre+R,taperW]];
  const out=[];let last=w0,lastLong=long0,maxLongHit=0;
  for(let i=0;i<N;i++){
    const ws=addDays(start,i*7),av=availAt(p,ws),ci=checkinEffect(p,ws),maxW=Math.max(8,av.maxMiles);
    const ph=phases.find(([,s,l])=>i>=s&&i<s+l)||['taper',N-1,1];
    const phase=ph[0],prog=ph[2]>1?(i-ph[1])/(ph[2]-1):1,isRace=i===N-1,li=i-pre,ti=i-(pre+R);
    let recovery=phase==='recover'||(phase!=='taper'&&li>0&&(li+1)%k===0&&li!==R-1);
    if(ci.reset&&phase!=='taper')recovery=true;
    let miles,long;
    if(phase==='taper'){
      const f=taperW===3?[0.75,0.55,0.35]:taperW===2?[0.65,0.4]:[0.45];
      miles=last*f[Math.min(ti,f.length-1)];long=isRace?0:lastLong*(ti===0&&taperW===3?0.7:0.55);
    }else if(recovery){
      miles=Math.min(maxW,last*0.7);long=Math.max(3,lastLong*0.7);
      if(ci.reset){last*=0.85;lastLong*=0.85}
    }else{
      const ramp=baseW+buildW>1?Math.min(1,Math.max(0,li)/(baseW+buildW-1)):1;
      let target=phase==='peak'?maxW:w0+(maxW-w0)*ramp;

  }
  if(maxLongHit<longMax*0.85)notes.push(`For ${A.name||'your race'}, long runs reach about ${fmtDist(maxLongHit,p)}. More weekly running would let them build toward ${fmtDist(longMax,p)}. Raise your weekly ${U(p)==='km'?'kilometers':'miles'} in Setup if you can.`);
  if(!rp.have)notes.push('Add a recent race time under Running in Setup to get pace targets. Until then, run by effort and the talk test.');

function makeRide(type,hours,ctx){
  const def=RIDE[type];
  const st=buildSteps(type,hours,ctx);
  let tips=def.tips;
  if(ctx&&ctx.setting==='indoor'&&['long','endurance','b2b','racesim'].includes(type))tips=[...tips,'Indoors: use a big fan, keep two bottles and a towel handy, and stand up for 30 seconds every 20 minutes.'];
  if(ctx&&ctx.setting==='indoor'&&type==='racesim')tips=[...tips,'If the weather allows, ride this one outside on terrain like your race.'];
  return {kind:'ride',type,title:def.title,zone:def.zone,purpose:def.purpose,tips,steps:st.steps,hours:st.total/60,ctx};

function buildSteps(type,hours,ctx){

  const pr=ctx.prog||0;
  const structured=(mainFn)=>{
    add(15,'Z2','Warm up, building gradually');

    const mainMin=S.slice(before).reduce((a,s)=>a+s.min,0);
    const fill=T-15-10-mainMin;
    if(fill>=5)add(fill,'Z2','Steady endurance');
    add(10,'Z1','Cool down');
  };
  switch(type){
    case 'recovery':add(T,'Z1','Very easy spin');break;
    case 'endurance':case 'b2b':add(T,'Z2','Steady endurance');break;
    case 'skills':{const dr=Math.min(30,Math.max(10,T-25));add(15,'Z2','Easy warm up');add(dr,'Z1','Skills drills (see tips)');if(T-15-dr>=5)add(T-15-dr,'Z2','Steady endurance');break;}
    case 'long':{
      if(ctx.phase==='build'&&ctx.fam!=='short'&&T>=150){
        const n=pr>0.5?3:2;const blocks=n*20+(n-1)*10;const lead=Math.round((T-blocks)*0.55);
        add(lead,'Z2','Steady endurance');reps(n,20,'Z3',10,'Tempo block');add(T-lead-blocks,'Z2','Steady endurance, keep eating');
      }else add(T,'Z2','Steady endurance, eat every 20–30 min');
      break;}
    case 'racesim':{
      const n=T>=240?3:2;const blocks=n*20;const gap=Math.round((T-blocks)/(n+1));
      for(let i=0;i<n;i++){add(gap,'Z2',i===0?'Race start: settle in, start eating':'Endurance, keep fueling');add(20,'Z3','Race-pace climb or effort')}
      add(T-blocks-gap*n,'Z2','Finish steady; note how you feel');break;}
    case 'tempo':structured(()=>reps(2,15+Math.round(10*pr),'Z3',5));break;
    case 'sweetspot':structured(()=>reps(3,10+Math.round(10*pr),'SS',5));break;
    case 'threshold':structured(()=>{if(pr<0.34)reps(4,8,'Z4',4);else if(pr<0.67)reps(3,12,'Z4',5);else reps(2,20,'Z4',8)});break;
    case 'vo2':structured(()=>{
      if(pr<0.34)reps(5,3,'Z5',3);
      else if(pr<0.67){for(let s=0;s<3;s++){S.push({min:7.5,z:'Z5',label:'10 × (30 s hard / 15 s easy)',rep:{n:10,on:0.5,off:0.25,offZ:'Z1'}});if(s<2)add(3,'Z1','Easy spin')}}

    });break;
    case 'climbs':structured(()=>reps(pr<0.5?4:5,pr<0.5?6:8,'Z4',4,'Climb: seated, stand 30–60 s every few minutes'));break;
    case 'anaerobic':structured(()=>reps(6+Math.round(2*pr),1,'Z6',3,'1-minute hard effort'));break;
    case 'sprints':add(20,'Z2','Easy warm up');for(let i=0;i<6;i++){add(0.25,'Z7','Sprint, 15 s');add(4.75,'Z2','Easy recovery')}

    case 'racepace':structured(()=>ctx.fam==='ultra'?reps(2,30,'Z3',10,'Race-pace effort'):reps(3,15,'SS',5,'Race-pace effort'));break;
    case 'taperSharp':structured(()=>{reps(3,3,'Z5',3);add(3,'Z1','Easy spin');for(let i=0;i<3;i++){add(0.2,'Z7','Sprint, 12 s');add(2,'Z1','Easy spin')}});break;

function eventTips(p,ev){
  const fam=eventFamily(ev),out=[];
  if(+ev.elevationFt>=5000)out.push({t:'Altitude',d:`Your event reaches about ${(+ev.elevationFt).toLocaleString()} ft. Aerobic power drops at altitude, so plan to ride at a lower power or heart rate than at home and pace the first hours conservatively. If you can, arrive at least 10–14 days early to start adapting; if not, arriving the day before is a common alternative. Drink more than usual and ask your doctor to check iron levels a few months out.`});
  if(isRun(ev)){
    const long=['marathon','half','trail'].includes(ev.type);
    out.push({t:'Build mileage gradually',d:'Most running injuries come from doing too much too soon. Weekly running in your plan rises gradually, with a lighter week every few weeks. Sharp jumps in weekly distance (more than about 30% over two weeks) are linked to more injuries. If something hurts in a way that changes how you run, take two or three days off and check in.'});
    if(long)out.push({t:'Practice race fueling',d:`For a ${ev.type==='half'?'half marathon':'marathon'}, take in about 30–60 g of carbohydrate per hour, starting in the first 30–45 minutes. Up to 90 g per hour is possible if you’ve trained your gut. Use your long runs to test the exact gels or chews and drinks you’ll use on race day.`});
    out.push({t:'Pace evenly',d:'Even pacing, or a slightly faster second half, gives the best result for most runners. Go out at or a little slower than goal pace for the first few miles, even when it feels too easy.'});
    if(long)out.push({t:'Taper',d:'Your plan cuts running for the last 2–3 weeks while keeping a little quality. Research on recreational marathoners found that longer, disciplined tapers were linked to faster finish times. Trust it; the fitness is already there.'});
    out.push({t:'Nothing new on race day',d:'Race in shoes you’ve run in for a few weeks, and in clothes and fuel you’ve tested on long runs.'});
    if(+p.age>=50)out.push({t:'Recovery for masters runners',d:'Your plan uses a lighter week every third week and keeps strength training in every phase. Sleep, protein (about 1.6 g per kg of body weight per day) and easy days matter more with age.'});
    return out;
  }
  if(fam==='ultra')out.push({t:'Fueling is a skill you train',d:`For events over 2.5 hours, research supports 60–90 g of carbohydrate per hour, using mixed sugars (glucose plus fructose) at the high end. Start lower on long rides and build up so your gut adapts. Practice every long ride with the exact foods and drinks you will use on the day.`});
  else if(fam==='endurance')out.push({t:'Fueling',d:`For 1–2.5 hour efforts, 30–60 g of carbohydrate per hour is the usual target. Practice it on long rides and race simulations.`});
  const dd=disc(ev);
  if(dd==='timed')out.push({t:'Timed races',d:`Pick an effort you can hold for the whole race and ride your laps at a steady pace; most riders slow down late because they started too fast. Plan quick pit stops with food, bottles and spare clothing laid out in order.${+ev.durationH>=12?' Racing through the night means practicing with your lights on a few training rides, packing warm layers, and deciding ahead of time whether you will stop to sleep.':''} On a relay team, eat and drink right after each lap and stay warm between them.`});
  if(dd==='cx')out.push({t:'Cyclocross skills',d:'Cyclocross rewards skills as much as fitness. Use the weekly skills ride to practice dismounts and remounts, shouldering the bike over barriers, run-ups, and cornering on grass or mud. Starts are fast: practice hard 30-second efforts from a standstill.'});
  if(dd==='roadrace')out.push({t:'Racing in a bunch',d:'Road races are decided by surges: attacks, climbs and the sprint. The harder interval sessions in your plan build that repeat punch. Stay near the front third, out of the wind, and save your efforts for the moments that matter.'});
  if(dd==='xc')out.push({t:'Cross-country racing',d:'XC races start fast and stay hard, with repeated short climbs. Your build and peak phases focus on short, hard intervals to match. Pre-ride the course if you can, and practice a hard first five minutes so the start doesn’t surprise you.'});
  if(['mtb','xc','gravel','timed'].includes(dd))out.push({t:'Skills and equipment',d:`Technical riding costs energy when you’re tense. The weekly skills ride and the Skills tab are part of the plan. Do your long rides on your race bike with race tires and pressures.`});
  if(['crit','road','roadrace'].includes(dd))out.push({t:'Riding in a group',d:`Practice group riding before the event: hold your line, ride smoothly, and get comfortable close to other wheels. Drafting saves a large share of your energy.`});
  if(fam==='ultra')out.push({t:'Pacing and cutoffs',d:`Most long-event mistakes happen in the first hour. Ride the opening at endurance effort even when others go faster. If the event has time cutoffs, work out the pace you need for each checkpoint and carry it on your top tube.`});
  if(+p.age>=50)out.push({t:'Recovery for masters riders',d:`Your plan uses a lighter week every third week instead of every fourth, keeps some high-intensity work year-round, and keeps strength training in every phase. Sleep and protein (about 1.6 g per kg of body weight per day, spread across meals) matter more with age.`});
  return out;
}

  return `<div class="profile" role="img" aria-label="Workout intensity profile">${steps.map(s=>`<i class="z${s.z}" style="--w:${(s.min/tot*1000).toFixed(1)};--h:${Math.round(Z(s.z).i/7.2*100)}%" title="${esc(fmtMin(s.min))} ${esc(s.label)}"></i>`).join('')}</div>`;
}
function zoneChip(k){return `<span class="chip z${k}"><span class="dot"></span>${k==='SS'?'Sweet spot':`${k} ${Z(k).name}`}</span>`}

function vToday(){
  const p=P(),pl=state.plan;
  if(pl.error)return `<div class="card"><p class="err">${esc(pl.error)}</p><p style="margin-top:10px"><a class="btn primary" href="#setup">Open Setup</a></p></div>`;
  const sel=parse(state.sel);const wkStart=monday(sel);
  const found=findDay(state.sel);
  let html=exampleBanner();
  html+=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${found?`Week ${found.week.i+1} of ${pl.N} · ${phaseName(found.week)}`:'Outside your plan'}</div></div>
    <div class="row"><button class="btn" data-act="wk" data-n="-7" aria-label="Previous week">←</button><button class="btn" data-act="today">Today</button><button class="btn" data-act="wk" data-n="7" aria-label="Next week">→</button></div></div>`;
  if(checkinDue())html+=`<div class="card checkin-card"><div><div class="eyebrow">Check-in due</div><h2 style="margin-top:4px">How have the last two weeks gone?</h2><p class="small muted" style="margin-top:4px">Two minutes. Your plan adjusts from next Monday to fit how you’re doing and your schedule.</p></div><a class="btn primary" href="#checkin">Check in</a></div>`;
  html+=`<div class="strip" role="group" aria-label="Days of this week">`;
  for(let i=0;i<7;i++){
    const d=addDays(wkStart,i),k=dkey(d),f=findDay(k);const z=f?dayZone(f.day):'REST';const done=state.store.done[k];
    html+=`<button class="z${z} ${k===dkey(today())?'is-today':''} ${done?'done':''}" aria-pressed="${k===state.sel}" data-act="sel" data-k="${k}"><span class="dn">${DAYN[i]}</span><span class="dd">${d.getDate()}</span><span class="bar"></span><span class="tick">${done?'✓ done':''}</span></button>`;
  }
  html+=`</div>`;
  if(!found){
    const before=sel<pl.start;
    html+=`<div class="card"><h2>${before?'Your plan hasn’t started yet':'Your event is done'}</h2><p class="muted" style="margin-top:8px">${before?`Training starts ${fmtD(pl.start)}.`:'Set up your next event in Setup.'}</p></div>`;
    return html;
  }
  const {day,week}=found;
  const isToday=state.sel===dkey(today());
  html+=day.items.map((it,idx)=>itemCard(it,day,week,isToday,idx)).join('');
  return html;
}

const ARTICLES=[
 {t:'Running form and cadence',k:'runform',q:'running form technique',b:['Good form is mostly relaxed form: tall posture, a slight forward lean from the ankles, relaxed shoulders and hands, and arms swinging forward and back rather than across the body.','<b>Cadence:</b> many runners overstride, landing with the foot far ahead of the body. Increasing step rate by 5–10% shortens the stride and reduces load on the knee and hip. Count steps for 30 seconds and double it; try raising it a few steps per minute over several weeks.','<b>Landing:</b> aim for the foot to land closer to under your body. Don’t force a forefoot strike; focus on quick, light steps.','<b>Strides</b> (in your easy runs) are the simplest way to practice smooth, efficient form at speed.']},
 {t:'Avoiding running injuries',k:'runinjury',q:'running injury prevention',b:['<b>Build gradually.</b> Big jumps in weekly distance are linked to more injuries. Your plan increases slowly and includes recovery weeks.','<b>Keep easy runs easy.</b> Most running should be conversational. Running every run hard adds stress without much extra fitness.','<b>Strength train.</b> Calf raises, split squats, step-ups and hip work in the Gym tab make muscles and tendons more resilient and improve running economy.','<b>Listen to warning signs:</b> pain that gets worse during a run, changes how you run, or lingers the next morning. Take two or three days off; if it persists, see a doctor or physical therapist.','<b>Shoes:</b> pick shoes that feel comfortable. Rotate in new shoes gradually before old ones are worn out.']},
 {t:'Marathon pacing and fueling',k:'marathon',q:'marathon pacing fueling',b:['<b>Pacing:</b> the most common marathon mistake is starting too fast. Plan to run the first 5–10K at or slightly slower than goal pace. Even pacing finishes fastest for most runners.','<b>Fueling:</b> take 30–60 g of carbohydrate per hour (more if your gut is trained), starting in the first 30–45 minutes. Gels with water at aid stations are the simplest approach.','<b>Practice:</b> long runs with race-pace sections are where you rehearse pace, fuel, shoes and clothing.','<b>The day before:</b> a carbohydrate-rich dinner you know well, fluids through the day, and an early night. A short shakeout run is optional.']},
 {t:'Bike fit basics',k:'fit',q:'bike fit saddle height',b:['A good fit prevents most overuse pain and lets you produce power for hours. A professional fit is worth it before a big training year; these are the basics to check.','<b>Saddle height:</b> at the bottom of the stroke, with your heel on the pedal, your leg should be straight. With the ball of the foot on the pedal, that leaves a slight bend (roughly 25–35° at the knee).','<b>Saddle position:</b> level, or nose down a degree or two. Knee pain at the front often means too low; pain behind the knee often means too high.','<b>Reach:</b> elbows slightly bent and shoulders relaxed. Numb hands or a sore neck usually means too much reach or too much weight on the hands.','<b>Cleats:</b> ball of the foot over the pedal axle; let the feet sit at their natural angle.']},
 {t:'Pedaling and cadence',k:'pedaling',q:'pedalling technique cadence',b:['Most riders are efficient between about 80 and 95 rpm on flat ground and somewhat lower on steep climbs. There is no single right cadence; smooth matters more than fast.','<b>Drill: high-cadence spin-ups.</b> During an endurance ride, raise cadence gradually over 1 minute until you start bouncing on the saddle, then back off slightly and hold 30 seconds. 4–5 repeats.','<b>Drill: single-leg focus.</b> On a trainer, unclip one foot and pedal 30–60 seconds with the other, aiming for no “dead spot” at the top. Switch legs.','Relax your upper body. Tension in the shoulders and grip wastes energy over long events.']},
 {t:'Climbing',k:'climbing',q:'how to climb',b:['<b>Seated</b> climbing is more efficient for steady grades: slide back on the saddle, relax the arms, and keep a steady rhythm.','<b>Standing</b> uses more energy but uses different muscles and helps on steep pitches. Shift up one or two gears as you stand so your cadence doesn’t spike, and let the bike rock gently under you.','<b>Pace the climb, not the moment.</b> Start a long climb at an effort you could hold to the top. On long events, climbs are where most riders overspend.','<b>On loose climbs (MTB/gravel):</b> stay seated to keep weight on the rear wheel, lower your chest toward the bars to keep the front wheel down, and keep pedal strokes smooth to avoid spinning out.']},
 {t:'Descending and cornering',k:'descending',q:'descending cornering',b:['<b>Look where you want to go</b>, through the exit of the corner, not at the obstacle.','<b>Brake before the corner</b>, in a straight line, then release and roll through.','<b>Outside pedal down, weight on it</b>, inside knee and elbow relaxed. Lean the bike more than your body.','<b>Mountain bike descending:</b> use the “attack position”: pedals level, knees and elbows bent, hips back, eyes up. Your arms and legs are the suspension; let the bike move under you.','Practice the same corner several times at increasing speed rather than riding many corners once.']},
 {t:'Rough terrain and trail skills',k:'trail',q:'gravel skills',b:['<b>Light hands, heavy feet.</b> Weight goes through the pedals, not the handlebar.','<b>Speed is your friend</b> over rocks and roots. Momentum carries you over obstacles that stop you at walking pace.','<b>Line choice:</b> look 3–5 seconds ahead and pick the smoothest line early.','<b>Drills for the skills ride:</b> track stands (balance stopped for 10+ seconds), tight figure-eights in a parking lot, riding over a 2×4 on the ground, braking hard to a stop in a marked distance, unclipping quickly on both sides.','Practice walking and pushing your bike uphill efficiently. In long mountain events most riders walk some sections.']},
 {t:'Fueling and hydration',k:'fueling',q:'fuelling nutrition',b:['<b>Before:</b> a carb-rich meal 2–4 hours before key sessions and events.','<b>During:</b> under 1 hour, water is usually enough. 1–2.5 hours: 30–60 g carbohydrate per hour. Over 2.5 hours: 60–90 g per hour, using glucose and fructose blends at higher amounts.','<b>Train the gut:</b> start at what you tolerate and add 10 g per hour every week or two on long rides.','<b>Fluids:</b> drink to thirst, typically 400–800 ml per hour depending on heat and size. Add sodium on long or hot rides. Weigh yourself before and after long rides: losing more than 2–3% of body weight means drink more next time.','<b>After:</b> carbohydrate plus about 20–40 g of protein within a couple of hours. Daily protein of about 1.6 g per kg supports strength gains.']},
 {t:'Altitude',k:'altitude',q:'altitude',b:['Less oxygen at altitude lowers aerobic power, and the effect grows as you go higher. The same power feels harder and your heart rate runs higher.','<b>Pace by feel and power, not your sea-level heart rate.</b> Expect to ride somewhat slower on climbs.','<b>Timing:</b> adaptation takes weeks. Arriving 10–14+ days early helps; arriving the day before minimizes the time you feel worst. The days in between are often the hardest.','<b>Hydrate more</b>: the air is dry and you breathe more.','<b>Iron:</b> your body needs iron to adapt. Ask your doctor about checking ferritin a few months before the event. Don’t supplement without testing.','Headache, nausea or unusual breathlessness at rest are warning signs. Descend and seek medical help if they get worse.']},

 {t:'Recovery and sleep',k:'recovery',q:'recovery sleep',b:['Fitness is built while you recover, not while you train. Easy days should be truly easy so hard days can be truly hard.','<b>Sleep</b> 7–9 hours. It is the most effective recovery tool.','<b>Warning signs</b> of doing too much: resting heart rate up more than 5–7 bpm for several days, poor sleep, irritability, heavy legs that don’t improve with rest. Take extra easy days.','Recovery weeks are part of the plan, not a break from it.']},

    events,changes,checkins:old.checkins||[]};

  p.run={units,raceDist:v('f-run-rd'),raceTime:v('f-run-rt'),curMiles:rf('f-run-cur'),maxMiles:rf('f-run-max'),longest:rf('f-run-long')};

  if(p.run.maxMiles&&p.run.curMiles>p.run.maxMiles)p.run.maxMiles=p.run.curMiles;
  if(!events.length)errs.push('Add at least one event.');
  if(events.some(e=>!e.date))errs.push('Every event needs a date.');
  if(days.filter(Boolean).length<3)errs.push('Pick at least 3 training days.');
  if(changes.some(c=>c.days.filter(Boolean).length<3))errs.push('Each schedule change needs at least 3 riding days.');
  if(p.maxHours<p.currentHours)p.maxHours=p.currentHours;
  if(!days[p.longDay]){const last=[5,6,4,3,2,1,0].find(i=>days[i]);if(last!=null)p.longDay=last}
  return {p,errs};
}

const pdfSafe=s=>String(s).replace(/₂/g,'2').replace(/[→↗]/g,'').replace(/🏁\s?/g,'').replace(/[“”]/g,'"').replace(/[‘’]/g,"'");

/* ============ device workout files ============ */
const ZPCT={Z1:[0.45,0.55],Z2:[0.60,0.72],Z3:[0.78,0.86],SS:[0.88,0.93],Z4:[0.95,1.02],Z5:[1.08,1.18],Z6:[1.25,1.45],Z7:[1.5,2.0]};
const zMid=z=>{const r=ZPCT[z]||ZPCT.Z2;return (r[0]+r[1])/2};
const ascii=s=>pdfSafe(s).replace(/[–—]/g,'-').replace(/×/g,'x').normalize('NFKD').replace(/[^\x20-\x7E]/g,'');
const slug=s=>ascii(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function expandSteps(steps){
  const out=[];
  for(const s of steps){
    if(s.rep){for(let k=0;k<s.rep.n;k++){out.push({sec:Math.round(s.rep.on*60),z:s.z,label:'Hard',kind:'active'});out.push({sec:Math.round(s.rep.off*60),z:s.rep.offZ||'Z1',label:'Easy',kind:'rest'})}continue}
    const kind=/^warm/i.test(s.label)?'warmup':/^cool/i.test(s.label)?'cooldown':(s.z==='Z1'&&/easy spin/i.test(s.label))?'rest':'active';
    out.push({sec:Math.max(5,Math.round(s.min*60)),z:s.z,label:s.label,kind});
  }
  return out;
}
const xmlEsc=s=>String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
const wktName=(it,date)=>`${dkey(date)} ${ascii(it.title)}`;
function makeZWO(it,date){
  const f=n=>n.toFixed(2);
  const body=expandSteps(it.steps).map(s=>{
    const msg=`<textevent timeoffset="0" message="${xmlEsc(ascii(s.label))}"/>`;
    if(s.kind==='warmup')return `    <Warmup Duration="${s.sec}" PowerLow="0.45" PowerHigh="0.70">${msg}</Warmup>`;
    if(s.kind==='cooldown')return `    <Cooldown Duration="${s.sec}" PowerLow="0.60" PowerHigh="0.40">${msg}</Cooldown>`;
    if(s.z==='Z7')return `    <FreeRide Duration="${s.sec}">${msg}</FreeRide>`;
    return `    <SteadyState Duration="${s.sec}" Power="${f(zMid(s.z))}">${msg}</SteadyState>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<workout_file>\n  <author>WattFire</author>\n  <name>${xmlEsc(wktName(it,date))}</name>\n  <description>${xmlEsc(ascii(it.purpose))}</description>\n  <sportType>bike</sportType>\n  <category>WattFire</category>\n  <tags/>\n  <workout>\n${body}\n  </workout>\n</workout_file>\n`;
}
const FIT_CRC=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
function fitCrc(bytes,crc=0){for(const b of bytes){let t=FIT_CRC[crc&0xF];crc=(crc>>4)&0x0FFF;crc=crc^t^FIT_CRC[b&0xF];t=FIT_CRC[crc&0xF];crc=(crc>>4)&0x0FFF;crc=crc^t^FIT_CRC[(b>>4)&0xF]}return crc}
/* Encode a FIT workout file. steps: [{name, dur:'time'|'dist', val (ms or cm), target:'power'|'speed'|'open', lo, hi, intensity}] */
function fitWorkout(name,sport,steps){
  const B=[];
  const u8=v=>B.push(v&255),u16=v=>{u8(v);u8(v>>8)},u32=v=>{u16(v&0xFFFF);u16(v>>>16)};
  const str=(s,n)=>{const e=new TextEncoder().encode(ascii(s));for(let i=0;i<n;i++)u8(i<n-1&&i<e.length?e[i]:0)};
  const def=(local,gnum,fields)=>{u8(0x40|local);u8(0);u8(0);u16(gnum);u8(fields.length);for(const [n,sz,t] of fields){u8(n);u8(sz);u8(t)}};
  def(0,0,[[0,1,0x00],[1,2,0x84],[2,2,0x84],[3,4,0x8C],[4,4,0x86]]);
  u8(0);u8(5);u16(255);u16(0);u32(1+Math.floor(Math.random()*0x7FFFFFFE));u32(Math.floor(Date.now()/1000)-631065600);
  def(1,26,[[8,40,0x07],[4,1,0x00],[6,2,0x84]]);
  u8(1);str(name,40);u8(sport);u16(steps.length);
  def(2,27,[[254,2,0x84],[0,32,0x07],[1,1,0x00],[2,4,0x86],[3,1,0x00],[4,4,0x86],[5,4,0x86],[6,4,0x86],[7,1,0x00]]);
  steps.forEach((s,i)=>{
    u8(2);u16(i);str(s.name,32);u8(s.dur==='dist'?1:0);u32(Math.max(1,Math.round(s.val)));
    u8(s.target==='power'?4:s.target==='speed'?0:2);u32(0);u32(s.target==='open'?0:Math.round(s.lo));u32(s.target==='open'?0:Math.round(s.hi));u8(s.intensity);
  });
  const data=Uint8Array.from(B),h=new Uint8Array(14),dv=new DataView(h.buffer);
  h[0]=14;h[1]=0x10;dv.setUint16(2,2132,true);dv.setUint32(4,data.length,true);h.set([46,70,73,84],8);dv.setUint16(12,fitCrc(h.subarray(0,12)),true);
  const crc=fitCrc(data,fitCrc(h)),out=new Uint8Array(16+data.length);
  out.set(h);out.set(data,14);out[out.length-2]=crc&255;out[out.length-1]=crc>>8;
  return out;
}
const FIT_INT={active:0,rest:1,warmup:2,cooldown:3,recovery:4};
function makeFIT(it,date,p){
  const ftp=+p.ftp;
  return fitWorkout(wktName(it,date),2,expandSteps(it.steps).map(s=>{
    const r=ZPCT[s.z]||ZPCT.Z2;
    const t=s.z==='Z7'?{target:'open'}:ftp?{target:'power',lo:Math.round(ftp*r[0])+1000,hi:Math.round(ftp*r[1])+1000}:{target:'power',lo:Math.round(r[0]*100),hi:Math.round(r[1]*100)};
    return {name:s.label,dur:'time',val:s.sec*1000,...t,intensity:FIT_INT[s.kind]};
  }));
}
/* Running workout for Garmin watches: distance steps with pace (speed) targets. */
function makeRunFIT(it,date,p){
  const rp=runPaces(p);
  return fitWorkout(wktName(it,date),1,it.steps.map(s=>{
    const kind=/^warm/i.test(s.label)?'warmup':/^cool/i.test(s.label)?'cooldown':(s.z==='Z1'&&/jog|walk/i.test(s.label))?'recovery':'active';
    let t={target:'open'};
    if(rp.have&&s.z!=='Z7'&&kind!=='recovery'){const [fast,slow]=paceRange(s.z,rp);t={target:'speed',lo:1609.344/slow*1000,hi:1609.344/fast*1000}}
    return {name:s.label,...(s.timed?{dur:'time',val:s.min*60000}:{dur:'dist',val:s.dist*160934.4}),...t,intensity:FIT_INT[kind]};
  }));
}
const deviceFile=(it,date,fmt)=>fmt==='garmin'?{name:`${dkey(date)}-${slug(it.title)}.fit`,data:makeRunFIT(it,date,P())}:{name:`${dkey(date)}-${slug(it.title)}.${fmt}`,data:fmt==='zwo'?makeZWO(it,date):makeFIT(it,date,P())};
const FMTN={zwo:'zwift',fit:'wahoo',garmin:'garmin'};
async function deliverFiles(files,zipName){
  if(files.length===1&&!state.inClaude)return offer(files[0].name,files[0].data);
  if(!window.JSZip){toast('Couldn’t load the zip tool. Check your connection and try again.');return}
  const z=new JSZip();files.forEach(f=>z.file(f.name,f.data));
  offer(zipName,await z.generateAsync({type:'blob'}));
}
async function offer(filename,data){
  const dl=state.downloads;
  if(!dl&&!state.inClaude){const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return}
  if(!dl){toast('Downloads aren’t available in this view.');return}
  try{await dl.save({filename,data});toast('Saved')}catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'A save is already open. Try again in a moment.':'Couldn’t save the file here.')}
}

/* ============ router + events ============ */
function vDevices(){

  <div class="card"><h2>Zwift</h2><p class="muted small" style="margin-top:4px">Uses the <b>Zwift file (.zwo)</b>. Files are added on a computer; Zwift then syncs them to your account.</p>

  </ol>

  <div class="card"><h2>Wahoo ELEMNT bike computers</h2><p class="muted small" style="margin-top:4px">Uses the <b>Wahoo file (.fit)</b>. Pick the option that matches your device.</p>

  <h3 style="margin-top:14px">Option 2: intervals.icu (any ELEMNT, no cable)</h3>
  <ol class="how">
   <li>Create a free account at <a href="https://intervals.icu" target="_blank" rel="noopener">intervals.icu ↗</a>.</li>
   <li>In <b>Settings → Connections</b>, connect Wahoo and allow it to write to your account. Turn on <b>Upload planned workouts</b> and choose <b>Ride</b> as the type.</li>
   <li>Open the intervals.icu calendar and drag a .fit or .zwo file onto the day you’ll ride it.</li>
   <li>Open the ELEMNT app on your phone and sync. The workout appears in the ELEMNT’s planned workouts.</li>
  </ol>
  <p class="small muted" style="margin-top:6px">If today’s workout doesn’t show up, give it a start time later than now in intervals.icu and sync again.</p></div>
  <div class="card" id="garmin"><h2>Garmin watches (runs)</h2><p class="muted small" style="margin-top:4px">Uses the <b>Garmin file (.fit)</b> on each run. Each step has its distance and pace range, so the watch tells you when to speed up or slow down.${runPaces(P()).have?'':' You haven’t entered a race time yet, so steps have distances but no pace targets.'}</p>
  <h3 style="margin-top:14px">Option 1: USB cable</h3>
  <ol class="how">
   <li>Download the Garmin files and unzip if needed.</li>

const VIEWS={checkin:vCheckin,devices:vDevices,today:vToday,plan:vPlan,strength:vStrength,technique:vTechnique,science:vScience,setup:vSetup};
function header(){
  const pl=state.plan,p=P();const el=document.getElementById('countdown');
  if(pl&&!pl.error){const t=today(),nx=pl.events.find(e=>e.d>=t);if(nx){const days=Math.round((nx.d-t)/864e5);el.innerHTML=`<strong>${days>=14?Math.floor(days/7)+' wk':days===0?'Today':days+' d'}</strong> ${days===0?'':'to '}${esc(nx.name)} <span class="muted">(${nx.priority})</span>`}else el.textContent='Season complete'}
  else el.textContent='';
}
function render(scrollTop){
  let h=(location.hash||'#today').slice(1);const anchor=h==='devices-garmin'?'garmin':null;if(anchor)h='devices';state.view=VIEWS[h]?h:'today';
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.v===state.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  document.getElementById('app').innerHTML=`<div class="stack">${VIEWS[state.view]()}</div>`;
  header();
  if(anchor){const el=document.getElementById(anchor);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),0)}
  if(state.view==='plan'&&!state.downloads&&state.inClaude){const n=document.getElementById('dl-note');if(n&&state.downloadsChecked){n.hidden=false;document.querySelectorAll('#dl-row button').forEach(b=>b.disabled=true)}}
  if(scrollTop)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>render(true));
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='sel'){state.sel=t.dataset.k;render()}
  else if(a==='today'){state.sel=dkey(today());render()}
  else if(a==='wk'){state.sel=dkey(addDays(parse(state.sel),+t.dataset.n));render()}
  else if(a==='goto'){state.sel=t.dataset.k;location.hash='#today'}
  else if(a==='play'){const id=t.dataset.id;if(!/^[\w-]{6,20}$/.test(id))return;const st=+t.dataset.start||0;const f=document.createElement('iframe');f.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1${st?'&start='+st:''}`;f.title=t.dataset.title||'Video';f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';t.replaceWith(f)}
  else if(a==='file'){const f=findDay(t.dataset.k);const it=f&&f.day.items[+t.dataset.i];const fmt=t.dataset.fmt;if(!it||it.kind!==(fmt==='garmin'?'run':'ride'))return;const fl=deviceFile(it,f.day.date,fmt);deliverFiles([fl],fl.name.replace(/\.(zwo|fit)$/,`-${FMTN[fmt]}.zip`))}
  else if(a==='weekfiles'){const w=state.plan.weeks[+t.dataset.w];if(!w)return;const fmt=t.dataset.fmt,kind=fmt==='garmin'?'run':'ride';const files=w.days.flatMap(d=>d.items.filter(x=>x.kind===kind).map(x=>deviceFile(x,d.date,fmt)));if(!files.length){toast(kind==='run'?'No runs this week.':'No rides this week.');return}deliverFiles(files,`wattfire-week-${w.i+1}-${FMTN[fmt]}.zip`)}
  else if(a==='add-ev'){document.getElementById('ev-list').insertAdjacentHTML('beforeend',evBlock({priority:'B',type:'gravel50'}))}
  else if(a==='add-chg'){const nm=addDays(monday(today()),7);document.getElementById('chg-list').insertAdjacentHTML('beforeend',chgBlock({from:dkey(nm),setting:'outdoor',maxHours:+(P().maxHours)||6,days:P().days,longDay:P().longDay}))}
  else if(a==='rm-block'){const b=t.closest('.sub');if(b)b.remove()}
  else if(a==='exf'){state.exFilter=t.dataset.f;render()}
  else if(a==='ex'){state.exFilter='all';location.hash='#strength';setTimeout(()=>{const el=document.getElementById('ex-'+t.dataset.x);if(el)el.scrollIntoView({block:'start'})},30)}
  else if(a==='pdf'){try{offer(`training-plan-${dkey(state.plan.eventDate)}.pdf`,makePDF())}catch(err){toast('Couldn’t build the PDF.')}}
  else if(a==='csv'){offer(`training-calendar-${dkey(state.plan.eventDate)}.csv`,makeCSV())}
  else if(a==='savejson'){offer('my-training-details.json',JSON.stringify({app:'wattfire',version:1,profile:P(),done:state.store.done},null,2))}
  else if(a==='reset'){document.getElementById('reset-confirm').hidden=false}
  else if(a==='reset-no'){document.getElementById('reset-confirm').hidden=true}
  else if(a==='reset-yes'){try{localStorage.removeItem(LS)}catch(_){}state.store={profile:exampleProfile(),done:{},example:true};state.example=true;state.plan=generatePlan(state.store.profile);toast('Cleared');render(true)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='evtype'){const n=t.dataset.n,info=EVINFO[t.value]||{},dur=document.getElementById('f-ev-dur-'+n),hint=document.getElementById('f-ev-hint-'+n);
    if(hint)hint.textContent=`${info.hint||''} Decimals are fine: 1.5 = 1 h 30 min.`;
    if(dur&&(dur.dataset.auto==='1'||!dur.value)&&info.preset){dur.value=info.preset;dur.dataset.auto='1'}}
  if(t.id==='f-ci-chg'){document.getElementById('ci-chg-fields').hidden=!t.checked}
  if(t.dataset&&t.dataset.act==='done'){if(t.checked)state.store.done[t.dataset.k]=true;else delete state.store.done[t.dataset.k];if(!state.example)saveStore();render()}
  if(t.id==='f-load'&&t.files&&t.files[0]){
    const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.profile||!(j.profile.event||j.profile.events))throw 0;migrateProfile(j.profile);state.store={profile:j.profile,done:j.done||{},example:false};state.example=false;state.plan=generatePlan(j.profile);saveStore();toast('Details loaded');location.hash='#today';render(true)}catch(_){toast('That file isn’t a WattFire details file.')}};r.readAsText(t.files[0]);
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.id&&t.id.startsWith('f-ev-dur-'))delete t.dataset.auto});
document.addEventListener('submit',e=>{
  if(e.target.id==='checkin-form'){e.preventDefault();submitCheckin();return}
  if(e.target.id!=='setup-form')return;e.preventDefault();
  const {p,errs}=readForm();const err=document.getElementById('form-err');
  if(errs.length){err.textContent=errs.join(' ');err.hidden=false;return}
  const plan=generatePlan(p);
  if(plan.error){err.textContent=plan.error;err.hidden=false;return}
  const done=state.example?{}:state.store.done;
  state.store={profile:p,done,example:false};state.example=false;state.plan=plan;saveStore();
  state.sel=dkey(today()<plan.start?plan.start:today());
  toast('Plan built');location.hash='#today';render(true);
});
render();
(async()=>{try{if(window.claude&&window.claude.use){state.downloads=await window.claude.use('downloads')}}catch(_){}state.downloadsChecked=true;if(state.view==='plan')render()})();
